career-profile:
  title: Profil
  summary: |
    <p>
      <strong>Tech Lead IA et Cloud-Native</strong> avec plus de
      <strong>10 ans d’expérience</strong> dans le développement de solutions
      d’automatisation, de plateformes internes et d’applications distribuées.
    </p>
    <p>
      J’interviens sur l’ensemble du cycle de vie d’une solution :
      <strong>conception, POC, développement d’API, architecture,
      conteneurisation, CI/CD et industrialisation sur Kubernetes</strong>.
      Je développe principalement avec <strong>Python et Go</strong> dans des
      environnements sécurisés et fortement contraints.
    </p>
    <p>
      Habitué aux environnements bancaires et internationaux, je définis les
      standards techniques, accompagne les équipes et transforme les idées
      innovantes en solutions robustes, maintenables et exploitables en production.
    </p>

