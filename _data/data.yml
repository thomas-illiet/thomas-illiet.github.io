career-profile:
  title: Résumé
  summary: |
    <p>
      <strong>Consultant DevOps</strong> avec <strong>10+ ans d’expérience</strong> en 
      <em>Cloud</em>, <em>CI/CD</em> et <em>automatisation</em>.  
      J’ai accompagné de grands comptes 
      (<strong>BNP Paribas</strong>, <strong>Société Générale</strong>, 
      <strong>Louis Vuitton</strong>, <strong>LVMH</strong>) 
      dans la <strong>modernisation</strong>, la <strong>sécurisation</strong> et 
      l’<strong>industrialisation</strong> de leurs environnements IT.  
    </p>
    <p>
      <strong>Pédagogue</strong>, je forme les équipes, accompagne leur 
      <em>montée en compétences</em> et pilote des projets complexes en 
      <strong>contexte international</strong>.
    </p>


experiences:
  title: Experiences Professionnelles
  info:
  - role: Consultant DevOps
    time: nov. 2024 - aujourd'hui
    company: BNP Paribas CIB
    details: |
      <p>
        Contribution à l’<strong>optimisation</strong> et à la <strong>fiabilisation</strong> du service informatique
        par la mise en place de solutions adaptées.
      </p>
      <ul>
        <li>Analyse et amélioration des performances</li>
        <li>Mise en œuvre de solutions d’optimisation</li>
        <li>Soutien à la continuité de service</li>
      </ul>
  - role: Consultant DevOps
    time: mars. 2024 - nov. 2024
    company: BNP Paribas
    details: |
      <p>
        Conception et <strong>déploiement d'une stack DevOps générique</strong> dans le cadre de la fusion des équipes d'automatisation,
        visant à <strong>réduire les délais de mise en production</strong> et <strong>améliorer la fiabilité</strong> de l'infrastructure.
      </p>
      <ul>
        <li>Architecture CI/CD : pipelines modulaires et réutilisables.</li>
        <li>Automatisation des déploiements et des tests d'intégration.</li>
        <li>Résultat : réduction des lead times et hausse de la disponibilité.</li>
      </ul>
  - role: Consultant en automatisation d'infrastructure Microsoft
    time: oct. 2019 - mars 2024
    company: BNP Paribas CIB
    details: |
      - Recherche et development pour amélioration de l'infrastructure 
      - Maintien en condition opérationnelle des outils/serveurs de l'équipe
      - Creation d'un moteur de synchronization de donnée Active Directory/Azure
      - Migration de l'infrastructure monolithique vers une infrastructure orientée microservices
      - Mise en place d'un cluster Keycloak avec interconnection sur le SSO de l'entreprise

  - role: Consultant SysAdmin/DevOps
    time: jan. 2019 - sept. 2019
    company: Louis Vuitton
    details: |
      Au sein de l'équipe de gestion des caisses, nous devions gerer l'exploitation, la maintenance
  
  - role: Consultant Cloud et Infrastructure 
    time: déc. 2018
    company: Moët & Chandon
    details: |
      - Audit des configurations GPO des serveurs Active Directory.
      - Détection des incohérences en vue de la migration vers un point unique.
      - Optimisation de la maintenance et fiabilisation de la production.

  - role: Consultant SysAdmin/DevOps
    time: avr. 2018 - déc. 2018
    company: Societe Generale
    details: |
      - Participation à la conception des nouvelles images systèmes.
      - Développement PowerShell pour automatiser les tâches.
      - Création d’une image Windows Server prête à l’usage.

  - role: Consultant Cloud et Infrastructure 
    time: déc. 2017 - mars 2018
    company: BNP Paribas
    details: |
      - Participation aux projets d’études de l’équipe PKI.
      - Création de maquettes pour tester et valider de nouvelles solutions.
      - Amélioration des outils internes et simplification des processus.
      - Apport de support technique et fonctionnel aux équipes projets.

  - role: Consultant SysAdmin/DevOps
    time: juin. 2017 - aujourd'hui
    company: Metsys
    details: |
      - Accompagnement de clients grands comptes et PME dans leurs projets IT.
      - Missions full-time chez les clients sur des environnements Linux / Windows / Cloud.
      - Mise en place et automatisation d’infrastructures (CI/CD, monitoring, sécurisation).
      - Conseil, support et transfert de compétences auprès des équipes internes.

  - role: Autres missions
