experiences:
  title: Expériences professionnelles
  info:
  - role: Consultant DevOps – IA & Innovation
    time: nov. 2024 - aujourd'hui
    company: BNP Paribas CIB
    details: |
      - Conception et développement de POC utilisant l’intelligence artificielle pour automatiser et optimiser les activités de production et d’infrastructure
      - Développement d’API, d’outils internes et de plateformes avec Python et Go
      - Gestion et évolution de l’infrastructure Kubernetes utilisée par l’équipe
      - Industrialisation des prototypes afin de les transformer en applications robustes, sécurisées et maintenables
      - Définition de standards d’architecture, de développement, de sécurité et de déploiement
      - Réalisation d’une plateforme centralisant les inventaires de plusieurs clusters OpenStack
      - Veille et R&D afin d’identifier de nouveaux cas d’usage autour de l’IA et de l’automatisation
      - Transfert de compétences et accompagnement d’équipes techniques internationales
      - Participation aux entretiens techniques et à l’évaluation de profils DevOps et développeurs
    
  - role: Consultant DevOps
    time: mars. 2024 - nov. 2024
    company: BNP Paribas
    details: |
      - Développement d’une architecture CI/CD avec des pipelines modulaires et réutilisables
      - Automatisation des déploiements et des tests d’intégration
      - Optimisation des processus, réduisant les délais de mise en production des services
      - Mise en place du monitoring pour les services critiques

  - role: Consultant en automatisation d'infrastructure Microsoft
    time: oct. 2019 - mars 2024
    company: BNP Paribas CIB
    details: |
      - Recherche et développement pour l'amélioration de l'infrastructure 
      - Maintien en condition opérationnelle des outils/serveurs de l'équipe
      - Création d'un moteur de synchronisation de donnée Active Directory/Azure
      - Migration de l'infrastructure monolithique vers une infrastructure orientée microservices
      - Mise en place d'un cluster Keycloak avec interconnection sur le SSO de l'entreprise

  - role: Consultant SysAdmin/DevOps
    time: jan. 2019 - sept. 2019
    company: Louis Vuitton
    details: |
      - Administration et maintenance des caisses en magasin (Windows)
      - Automatisation des tâches récurrentes via des scripts PowerShell
      - Participation à la mise en place d'automatisation de gestion de configuration
  
  - role: Consultant Cloud et Infrastructure 
    time: déc. 2018
    company: Moët & Chandon
    details: |
      - Audit des configurations GPO des serveurs Active Directory
      - Détection des incohérences en vue de la migration vers un point unique
      - Rédaction d’un rapport d’audit avec des recommandations pour améliorer la sécurité et la gestion des serveurs
      - Présentation des résultats aux équipes IT

  - role: Consultant SysAdmin/DevOps
    time: avr. 2018 - déc. 2018
    company: Societe Generale
    details: |
      - Participation à la conception des nouvelles images systèmes (Windows)
      - Collaboration avec les équipes de sécurité pour assurer la conformité des images
      - Développement PowerShell pour automatiser les tâches de maintenance
      - Création d’une image Windows Server prête à l’usage

  - role: Consultant Cloud et Infrastructure 
    time: déc. 2017 - mars 2018
    company: BNP Paribas
    details: |
      - Participation aux projets d’études concernant le futur de l'infrastructure PKI
      - Création de maquettes pour tester et valider de nouvelles solutions
      - Amélioration des outils internes et simplification des processus
      - Apport de support technique et fonctionnel aux équipes projets
  

  - role: Consultant SysAdmin/DevOps
    time: juin. 2017 - aujourd'hui
    company: Metsys
    details: |
      - Accompagnement de clients grands comptes et PME dans leurs projets IT
      - Missions full-time chez les clients sur des environnements Linux / Windows / Cloud
      - Mise en place et automatisation d’infrastructures (CI/CD, monitoring, sécurisation)
      - Conseil, support et transfert de compétences auprès des équipes internes

  - role: Autres missions
    time: 2013 - 2017
    details: |
      - Consultant Cloud et Infrastructure – John Paul
      - Migration Office 365 – Alstom
      - Administrateur systèmes & réseaux – ISI Expert, Vitalliance
      - Support IT – Mondelez, Digitick, Ophtalmic Compagnie

projects:
  title: Projets IA & Innovation
  intro: >
    Sélection de solutions développées autour de l’intelligence artificielle,
    de l’automatisation et des plateformes cloud-native.
  assignments:
    - title: Plateforme de POC IA
      tagline: >
        Conception d’outils permettant de tester rapidement des cas d’usage IA,
        puis de transmettre les solutions validées aux équipes chargées de leur
        industrialisation.
    - title: Passerelle sécurisée pour modèles LLM
      tagline: >
        Développement d’une API permettant de sécuriser, administrer et superviser
        l’accès à différents modèles d’intelligence artificielle.
    - title: Inventaire multi-cluster OpenStack
      tagline: >
        Développement d’une plateforme automatisée pour collecter, normaliser
        et centraliser les inventaires provenant de plusieurs environnements.
    - title: Plateforme de développement Kubernetes
      tagline: >
        Étude et conception d’environnements de développement isolés, sécurisés
        et déployés dynamiquement sur Kubernetes.
        
